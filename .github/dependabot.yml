# 依赖更新提醒：Dependabot 每周自动开 PR 更新前端(npm)和后端(go module)依赖。
# 项目依赖很干净（前端 6 个、后端 3 个），噪音可控。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
