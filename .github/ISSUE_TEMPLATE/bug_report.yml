name: 🐞 Bug 报告
description: 报告一个 bug，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。提交前请先搜一下已有 issue，确认不是重复。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 用一两句话说明发生了什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出可复现的最小步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 浏览器版本 / 部署方式（Docker 还是本地）/ 访问地址等
      placeholder: 例如 Chrome 126 / Docker Compose / http://...
  - type: textarea
    id: logs
    attributes:
      label: 截图 / 日志
      description: 相关截图、浏览器控制台报错、后端日志（`docker compose logs backend`）等
      render: shell
