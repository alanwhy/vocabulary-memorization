name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 这个功能要解决什么问题
      description: 描述你当前遇到的痛点或需求背景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望怎么实现，越具体越好
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他能满足需求的做法，以及为什么没选它们
  - type: textarea
    id: context
    attributes:
      label: 其他补充
      description: 截图、参考链接、相关 context 等
