<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背单词</title>
    <script>
      // 在样式和 JS bundle 生效前先把主题 class 打上，避免深色用户刷新时闪一帧白屏。
      // 逻辑与 src/composables/useTheme.js 保持一致：只有显式存过 dark 才是深色。
      try {
        if (localStorage.getItem('vocab_theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        // 隐私模式下 localStorage 可能不可用，忽略即可，退回默认浅色
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
