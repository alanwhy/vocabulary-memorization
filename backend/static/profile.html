<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>个人中心 · 背单词</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
<script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
<script src="https://unpkg.com/element-plus/dist/locale/zh-cn.js"></script>
<link rel="stylesheet" href="/common.css" />
<style>
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card + .card { margin-top: 16px; }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 0;
  }
</style>
</head>
<body>
<div id="app">
  <template v-if="checkingAuth">
    <div class="empty">加载中...</div>
  </template>

  <template v-else>
    <div class="topbar">
      <span>{{ currentUser ? currentUser.username : "" }}</span>
      <span>
        <a href="/">返回背单词</a>
      </span>
    </div>
    <h1>个人中心</h1>

    <div class="card" v-if="currentUser">
      <el-descriptions :column="1" border>
        <el-descriptions-item label="用户名">{{ currentUser.username }}</el-descriptions-item>
        <el-descriptions-item label="角色">{{ currentUser.is_admin ? "超管" : "普通用户" }}</el-descriptions-item>
        <el-descriptions-item label="注册时间">{{ formatTime(currentUser.created_at) }}</el-descriptions-item>
      </el-descriptions>
    </div>

    <div class="card">
      <el-button type="primary" @click="pwDialogVisible = true">修改密码</el-button>
    </div>

    <el-dialog v-model="pwDialogVisible" title="修改密码" width="380px" style="max-width: 92vw;" @closed="resetPwForm">
      <el-form label-position="top">
        <el-form-item label="原密码">
          <el-input type="password" v-model="pwForm.old_password" show-password />
        </el-form-item>
        <el-form-item label="新密码">
          <el-input type="password" v-model="pwForm.new_password" placeholder="至少 6 位" show-password />
        </el-form-item>
        <el-form-item label="确认新密码">
          <el-input type="password" v-model="pwForm.confirm_password" show-password @keyup.enter="submitChangePassword" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="pwDialogVisible = false">取消</el-button>
        <el-button type="primary" :loading="changingPassword" @click="submitChangePassword">提交</el-button>
      </template>
    </el-dialog>
  </template>
</div>

<script type="module">
import { formatTime, requireLogin } from "/common.js";
const { createApp, ref, reactive, onMounted } = Vue;
const { ElMessage } = ElementPlus;

createApp({
  setup() {
    const checkingAuth = ref(true);
    const currentUser = ref(null);

    const pwDialogVisible = ref(false);
    const pwForm = reactive({ old_password: "", new_password: "", confirm_password: "" });
    const changingPassword = ref(false);

    function resetPwForm() {
      pwForm.old_password = "";
      pwForm.new_password = "";
      pwForm.confirm_password = "";
    }

    async function submitChangePassword() {
      if (changingPassword.value) return;
      if (!pwForm.old_password || !pwForm.new_password) {
        ElMessage.error("请填写完整");
        return;
      }
      if (pwForm.new_password.length < 6) {
        ElMessage.error("新密码长度至少 6 位");
        return;
      }
      if (pwForm.new_password !== pwForm.confirm_password) {
        ElMessage.error("两次输入的新密码不一致");
        return;
      }
      changingPassword.value = true;
      try {
        const res = await fetch("/api/me/password", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ old_password: pwForm.old_password, new_password: pwForm.new_password }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          ElMessage.error(data.error || "修改失败");
          return;
        }
        ElMessage.success("密码已修改");
        pwDialogVisible.value = false;
      } catch (e) {
        ElMessage.error("网络错误，请重试");
      } finally {
        changingPassword.value = false;
      }
    }

    async function init() {
      try {
        const user = await requireLogin();
        if (!user) return;
        currentUser.value = user;
      } finally {
        checkingAuth.value = false;
      }
    }

    onMounted(init);

    return {
      checkingAuth,
      currentUser,
      pwDialogVisible,
      pwForm,
      changingPassword,
      resetPwForm,
      submitChangePassword,
      formatTime,
    };
  },
})
  .use(ElementPlus, { locale: window.ElementPlusLocaleZhCn })
  .mount("#app");
</script>
</body>
</html>
