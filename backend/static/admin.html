<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>后台管理 - 背单词</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
<script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
<script src="https://unpkg.com/element-plus/dist/locale/zh-cn.js"></script>
<link rel="stylesheet" href="/common.css" />
<style>
  #app { max-width: 640px; }
  h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 32px 0 12px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 12px 0 4px;
  }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 4px;
  }
  .checkbox-row input { width: auto; }
  button.primary {
    margin-top: 16px;
    padding: 10px 16px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  .msg {
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--accent); }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 500; }
  .badge {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: 5px;
  }
  .link-btn {
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .link-btn.danger { color: var(--muted); }
  .link-btn.danger:hover { color: var(--danger); }
  .export-btn {
    display: inline-block;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
  }
  .export-btn:hover { border-color: var(--accent); }
  .senses {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .sense {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }
  .sense .pos {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 1px 5px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .sense .translation {
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
  }
  code.generated-password {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="app">
  <template v-if="loading">
    <div class="msg">加载中...</div>
  </template>
  <template v-else-if="!isAdmin">
    <div class="msg error">无权限访问，正在跳转...</div>
  </template>
  <template v-else>
    <div class="topbar">
      <span><a href="/profile.html">{{ me.username }}</a><span class="badge" style="margin-left:6px;">超管</span></span>
      <a href="/">返回背单词</a>
    </div>
    <h1>后台管理</h1>

    <h2>用户管理</h2>
    <div class="card">
      <table>
        <thead><tr><th>用户名</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody>
          <tr v-for="u in users" :key="u.id">
            <td>{{ u.username }}</td>
            <td><span class="badge" v-if="u.is_admin">超管</span><span v-else>普通用户</span></td>
            <td>{{ formatTime(u.created_at) }}</td>
            <td><button class="link-btn" @click="resetPassword(u)">重置密码</button></td>
          </tr>
        </tbody>
      </table>

      <label>用户名</label>
      <input type="text" v-model="newUser.username" placeholder="新用户的用户名" />
      <label>密码</label>
      <input type="password" v-model="newUser.password" placeholder="至少 6 位" />
      <div class="checkbox-row">
        <input type="checkbox" id="isAdminCheckbox" v-model="newUser.is_admin" />
        <label for="isAdminCheckbox" style="margin:0;">设为超管</label>
      </div>
      <button class="primary" :disabled="creatingUser" @click="createUser">新增用户</button>
      <p class="msg" :class="{ error: !!userMsgError, ok: !!userMsgOk }">{{ userMsgError || userMsgOk }}</p>
    </div>

    <el-dialog v-model="resetResultVisible" title="密码已重置" width="380px" style="max-width: 92vw;">
      <p>用户「{{ resetUsername }}」的新密码：</p>
      <p><code class="generated-password">{{ generatedPassword }}</code>
         <el-button size="small" @click="copyPassword">复制</el-button></p>
      <template #footer>
        <el-button @click="resetResultVisible = false">关闭</el-button>
      </template>
    </el-dialog>

    <h2>DeepSeek 查词配置</h2>
    <div class="card">
      <div class="checkbox-row">
        <input type="checkbox" id="dsEnabled" v-model="dsForm.enabled" />
        <label for="dsEnabled" style="margin:0;">启用 DeepSeek 查词</label>
      </div>
      <label>API Key</label>
      <input type="password" v-model="dsForm.api_key" placeholder="sk-..." />
      <label>Base URL</label>
      <input type="text" v-model="dsForm.base_url" placeholder="https://api.deepseek.com" />
      <label>模型</label>
      <input type="text" v-model="dsForm.model" placeholder="deepseek-v4-flash" />
      <button class="primary" :disabled="savingSettings" @click="saveSettings">保存配置</button>
      <p class="msg" :class="{ error: !!settingsMsgError, ok: !!settingsMsgOk }">{{ settingsMsgError || settingsMsgOk }}</p>
    </div>

    <h2>词库管理</h2>
    <div class="card">
      <a class="export-btn" href="/api/admin/dictionary/export">导出 CSV</a>
      <input type="text" v-model="dictFilter" placeholder="按单词过滤" />
      <table style="margin-top: 12px;">
        <thead><tr><th>单词</th><th>释义</th><th>最后更新时间</th><th>操作</th></tr></thead>
        <tbody>
          <tr v-for="d in filteredDictEntries" :key="d.word_key">
            <td>{{ d.display_word }}</td>
            <td>
              <div class="senses" v-if="d.senses && d.senses.length">
                <div class="sense" v-for="(s, idx) in d.senses" :key="idx">
                  <span class="pos" v-if="s.pos">{{ s.pos }}</span>
                  <span class="translation">{{ s.translation }}</span>
                </div>
              </div>
              <span v-else>暂无释义</span>
            </td>
            <td>{{ formatTime(d.last_updated_at) }}</td>
            <td><button class="link-btn danger" @click="deleteDictEntry(d)">删除</button></td>
          </tr>
        </tbody>
      </table>
      <p class="msg" v-if="!dictEntries.length">词库暂无数据</p>
    </div>
  </template>
</div>

<script type="module">
import { formatTime, requireLogin } from "/common.js";
const { createApp, ref, reactive, computed, onMounted } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

createApp({
  setup() {
    const loading = ref(true);
    const isAdmin = ref(false);
    const me = ref(null);

    const users = ref([]);
    const newUser = reactive({ username: "", password: "", is_admin: false });
    const creatingUser = ref(false);
    const userMsgError = ref("");
    const userMsgOk = ref("");
    const generatedPassword = ref("");
    const resetUsername = ref("");
    const resetResultVisible = ref(false);

    const dsForm = reactive({ enabled: false, api_key: "", base_url: "", model: "" });
    const savingSettings = ref(false);
    const settingsMsgError = ref("");
    const settingsMsgOk = ref("");

    const dictEntries = ref([]);
    const dictFilter = ref("");
    const filteredDictEntries = computed(() => {
      const kw = dictFilter.value.trim().toLowerCase();
      if (!kw) return dictEntries.value;
      return dictEntries.value.filter((d) => d.word_key.includes(kw));
    });

    async function init() {
      try {
        const user = await requireLogin();
        if (!user) return;
        me.value = user;
        if (!me.value.is_admin) {
          isAdmin.value = false;
          window.location.href = "/";
          return;
        }
        isAdmin.value = true;
        await Promise.all([loadUsers(), loadSettings(), loadDictionary()]);
      } finally {
        loading.value = false;
      }
    }

    async function loadUsers() {
      const res = await fetch("/api/admin/users");
      if (res.ok) users.value = await res.json();
    }

    async function loadSettings() {
      const res = await fetch("/api/admin/settings");
      if (res.ok) {
        const data = await res.json();
        dsForm.enabled = data.enabled;
        dsForm.api_key = data.api_key;
        dsForm.base_url = data.base_url;
        dsForm.model = data.model;
      }
    }

    async function loadDictionary() {
      const res = await fetch("/api/admin/dictionary");
      if (res.ok) dictEntries.value = await res.json();
    }

    async function resetPassword(u) {
      try {
        await ElMessageBox.confirm(`确定重置用户「${u.username}」的密码吗？`, "提示", {
          confirmButtonText: "重置",
          cancelButtonText: "取消",
          type: "warning",
        });
      } catch (e) {
        return;
      }
      try {
        const res = await fetch(`/api/admin/users/${u.id}/reset-password`, { method: "POST" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          ElMessage.error(data.error || "重置失败");
          return;
        }
        resetUsername.value = u.username;
        generatedPassword.value = data.password;
        resetResultVisible.value = true;
      } catch (e) {
        ElMessage.error("网络错误，请重试");
      }
    }

    async function copyPassword() {
      try {
        await navigator.clipboard.writeText(generatedPassword.value);
      } catch (e) {
        // 剪贴板 API 不可用时忽略，管理员仍可从页面上手动选中复制
      }
    }

    async function deleteDictEntry(d) {
      try {
        await ElMessageBox.confirm(`确定从词库删除「${d.display_word}」的缓存记录吗？`, "提示", {
          confirmButtonText: "删除",
          cancelButtonText: "取消",
          type: "warning",
        });
      } catch (e) {
        return;
      }
      try {
        const res = await fetch(`/api/admin/dictionary/${encodeURIComponent(d.word_key)}`, { method: "DELETE" });
        if (!res.ok) throw new Error();
        dictEntries.value = dictEntries.value.filter((x) => x.word_key !== d.word_key);
      } catch (e) {
        ElMessage.error("删除失败，请重试");
      }
    }

    async function createUser() {
      userMsgError.value = "";
      userMsgOk.value = "";
      if (creatingUser.value) return;
      creatingUser.value = true;
      try {
        const res = await fetch("/api/admin/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newUser),
        });
        const data = await res.json();
        if (!res.ok) {
          userMsgError.value = data.error || "创建失败";
          return;
        }
        users.value.push(data);
        userMsgOk.value = `已创建用户 ${data.username}`;
        newUser.username = "";
        newUser.password = "";
        newUser.is_admin = false;
      } catch (e) {
        userMsgError.value = "网络错误，请重试";
      } finally {
        creatingUser.value = false;
      }
    }

    async function saveSettings() {
      settingsMsgError.value = "";
      settingsMsgOk.value = "";
      if (savingSettings.value) return;
      savingSettings.value = true;
      try {
        const res = await fetch("/api/admin/settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dsForm),
        });
        const data = await res.json();
        if (!res.ok) {
          settingsMsgError.value = data.error || "保存失败";
          return;
        }
        dsForm.enabled = data.enabled;
        dsForm.api_key = data.api_key;
        dsForm.base_url = data.base_url;
        dsForm.model = data.model;
        settingsMsgOk.value = "已保存";
      } catch (e) {
        settingsMsgError.value = "网络错误，请重试";
      } finally {
        savingSettings.value = false;
      }
    }

    onMounted(init);

    return {
      loading, isAdmin, me,
      users, newUser, creatingUser, userMsgError, userMsgOk, generatedPassword, resetUsername, resetResultVisible, createUser, resetPassword, copyPassword,
      dsForm, savingSettings, settingsMsgError, settingsMsgOk, saveSettings,
      dictEntries, dictFilter, filteredDictEntries, deleteDictEntry,
      formatTime,
    };
  },
})
  .use(ElementPlus, { locale: window.ElementPlusLocaleZhCn })
  .mount("#app");
</script>
</body>
</html>
