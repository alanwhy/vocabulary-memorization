<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>归档 · 背单词</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
<script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
<script src="https://unpkg.com/element-plus/dist/locale/zh-cn.js"></script>
<link rel="stylesheet" href="/common.css" />
<style>
  ul.word-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .word-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .word-main {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .word-main .word {
    font-size: 17px;
    font-weight: 600;
  }
  .senses {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .sense {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sense .pos {
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .sense .translation {
    font-size: 14px;
    color: var(--text);
    word-break: break-word;
  }
  .word-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .word-meta .count {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .word-meta .time {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .unarchive-btn, .delete-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .unarchive-btn:hover { color: var(--accent); }
  .delete-btn:hover { color: var(--danger); }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 0;
  }

  @media (max-width: 480px) {
    .word-card {
      flex-direction: column;
      align-items: flex-start;
    }
    .word-meta {
      width: 100%;
      justify-content: space-between;
    }
  }
</style>
</head>
<body>
<div id="app">
  <template v-if="checkingAuth">
    <div class="empty">加载中...</div>
  </template>

  <template v-else>
    <div class="topbar">
      <a href="/profile.html">{{ currentUser ? currentUser.username : "" }}</a>
      <span>
        <a href="/">返回背单词</a>
      </span>
    </div>
    <h1>归档</h1>

    <ul class="word-list" v-if="words.length">
      <li class="word-card" v-for="w in words" :key="w.id">
        <div class="word-main">
          <span class="word">{{ w.display_word }}</span>
          <div class="senses" v-if="w.senses && w.senses.length">
            <div class="sense" v-for="(s, idx) in w.senses" :key="idx">
              <span class="pos" v-if="s.pos">{{ s.pos }}</span>
              <span class="translation">{{ s.translation }}</span>
            </div>
          </div>
          <div class="senses" v-else>
            <div class="sense"><span class="translation">暂无释义</span></div>
          </div>
        </div>
        <div class="word-meta">
          <span class="count">×{{ w.review_count }}</span>
          <span class="time">{{ formatTime(w.last_reviewed_at) }}</span>
          <button class="unarchive-btn" @click="unarchiveWord(w)">取消归档</button>
          <button class="delete-btn" @click="deleteWord(w)">删除</button>
        </div>
      </li>
    </ul>
    <div class="empty" v-else>还没有归档的单词</div>
  </template>
</div>

<script type="module">
import { formatTime, requireLogin } from "/common.js";
const { createApp, ref, onMounted } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

createApp({
  setup() {
    const checkingAuth = ref(true);
    const currentUser = ref(null);
    const words = ref([]);

    async function loadWords() {
      try {
        const user = await requireLogin();
        if (!user) return;
        currentUser.value = user;

        const res = await fetch("/api/words?archived=1");
        if (res.ok) {
          words.value = await res.json();
        }
      } finally {
        checkingAuth.value = false;
      }
    }

    async function unarchiveWord(w) {
      try {
        const res = await fetch(`/api/words/${w.id}/unarchive`, { method: "POST" });
        if (!res.ok) throw new Error();
        words.value = words.value.filter((x) => x.id !== w.id);
      } catch (e) {
        // 忽略，用户可以再点一次
      }
    }

    async function deleteWord(w) {
      try {
        await ElMessageBox.confirm(`确定删除「${w.display_word}」吗？`, "提示", {
          confirmButtonText: "删除",
          cancelButtonText: "取消",
          type: "warning",
        });
      } catch (e) {
        return;
      }
      try {
        const res = await fetch(`/api/words/${w.id}`, { method: "DELETE" });
        if (!res.ok) throw new Error();
        words.value = words.value.filter((x) => x.id !== w.id);
      } catch (e) {
        ElMessage.error("删除失败，请重试");
      }
    }

    onMounted(loadWords);

    return {
      checkingAuth,
      currentUser,
      words,
      formatTime,
      unarchiveWord,
      deleteWord,
    };
  },
})
  .use(ElementPlus, { locale: window.ElementPlusLocaleZhCn })
  .mount("#app");
</script>
</body>
</html>
