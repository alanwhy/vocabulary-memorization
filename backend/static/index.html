<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>背单词</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
<script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
<script src="https://unpkg.com/element-plus/dist/locale/zh-cn.js"></script>
<link rel="stylesheet" href="/common.css" />
<style>
  .login-box {
    max-width: 360px;
    margin: 80px auto 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .login-box h1 { margin-bottom: 24px; }
  .login-box input[type="text"],
  .login-box input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
  }
  .login-box button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .login-box button:disabled { opacity: 0.6; cursor: default; }
  .login-error {
    color: var(--danger);
    font-size: 13px;
    margin: -4px 0 12px;
    min-height: 16px;
  }
  .login-contact {
    color: var(--muted);
    font-size: 12px;
    margin-top: 12px;
    text-align: center;
  }
  .input-wrap {
    margin-bottom: 8px;
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  .add-btn {
    flex-shrink: 0;
    padding: 0 20px;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .add-btn:disabled { opacity: 0.6; cursor: default; }
  .hint {
    font-size: 13px;
    color: var(--muted);
    margin: 6px 4px 24px;
    min-height: 16px;
  }
  .hint.error { color: var(--danger); }
  .stats {
    font-size: 13px;
    color: var(--muted);
    margin: 0 4px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .sort-toggle {
    display: flex;
    gap: 4px;
  }
  .sort-toggle button {
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .sort-toggle button.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .footer {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    margin-top: 24px;
  }
  ul.word-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .word-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .word-main {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .word-main .word {
    font-size: 17px;
    font-weight: 600;
  }
  .senses {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .sense {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sense .pos {
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .sense .translation {
    font-size: 14px;
    color: var(--text);
    word-break: break-word;
  }
  .sense .translation.pending {
    color: var(--muted);
    font-style: italic;
  }
  .word-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .word-meta .count {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .word-meta .time {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .delete-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .delete-btn:hover { color: var(--danger); }
  .archive-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 6px;
  }
  .archive-btn:hover { color: var(--accent); }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 0;
  }
  @media (max-width: 480px) {
    .word-card {
      flex-direction: column;
      align-items: flex-start;
    }
    .word-meta {
      width: 100%;
      justify-content: space-between;
    }
  }
</style>
</head>
<body>
<div id="app">
  <template v-if="checkingAuth">
    <div class="empty">加载中...</div>
  </template>

  <template v-else-if="!currentUser">
    <div class="login-box">
      <h1>背单词</h1>
      <input
        type="text"
        v-model="loginForm.username"
        placeholder="用户名"
        autofocus
        @keyup.enter="login"
      />
      <input
        type="password"
        v-model="loginForm.password"
        placeholder="密码"
        @keyup.enter="login"
      />
      <p class="login-error">{{ loginError }}</p>
      <button :disabled="loggingIn" @click="login">登录</button>
      <p class="login-contact">忘记密码或需要开通账号，请联系 alanwhy0528@gmail.com</p>
    </div>
  </template>

  <template v-else>
    <div class="topbar">
      <a href="/profile.html">{{ currentUser.username }}</a>
      <span>
        <a href="/archive.html">归档</a>
        <a href="/stats.html">统计</a>
        <a v-if="currentUser.is_admin" href="/admin.html">后台管理</a>
        <button @click="logout">退出登录</button>
      </span>
    </div>

    <h1>背单词</h1>
    <div class="input-wrap">
      <input
        ref="wordInputRef"
        type="text"
        v-model="inputWord"
        :disabled="submitting"
        @keyup.enter="submitWord"
        placeholder="输入英文单词，按回车记录"
        autofocus
      />
      <button class="add-btn" :disabled="submitting" @click="submitWord">添加</button>
    </div>
    <p class="hint" :class="{ error: !!errorMsg }">{{ errorMsg || placeholderHint }}</p>

    <div class="stats" v-if="words.length">
      <span>共 {{ words.length }} 个单词 · 累计背诵 {{ totalReviews }} 次</span>
      <span class="sort-toggle">
        <button :class="{ active: sortMode === 'count' }" @click="setSortMode('count')">按次数</button>
        <button :class="{ active: sortMode === 'time' }" @click="setSortMode('time')">按时间</button>
        <button :class="{ active: sortMode === 'alpha' }" @click="setSortMode('alpha')">按字母</button>
      </span>
    </div>

    <ul class="word-list" v-if="words.length">
      <li class="word-card" v-for="w in words" :key="w.id">
        <div class="word-main">
          <span class="word">{{ w.display_word }}</span>
          <div class="senses" v-if="w.senses && w.senses.length">
            <div class="sense" v-for="(s, idx) in w.senses" :key="idx">
              <span class="pos" v-if="s.pos">{{ s.pos }}</span>
              <span class="translation">{{ s.translation }}</span>
            </div>
          </div>
          <div class="senses" v-else-if="w.translating">
            <div class="sense"><span class="translation pending">查词中...</span></div>
          </div>
          <div class="senses" v-else>
            <div class="sense"><span class="translation">暂无释义</span></div>
          </div>
        </div>
        <div class="word-meta">
          <span class="count">×{{ w.review_count }}</span>
          <span class="time">{{ formatTime(w.last_reviewed_at) }}</span>
          <button class="archive-btn" @click="archiveWord(w)">归档</button>
          <button class="delete-btn" @click="deleteWord(w)">删除</button>
        </div>
      </li>
    </ul>
    <div class="empty" v-else>还没有记录，输入一个单词试试</div>
  </template>

  <div class="footer">v1.4.0</div>
</div>

<script type="module">
import { formatTime } from "/common.js";
const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

createApp({
  setup() {
    const checkingAuth = ref(true);
    const currentUser = ref(null);
    const loginForm = reactive({ username: "", password: "" });
    const loginError = ref("");
    const loggingIn = ref(false);

    const inputWord = ref("");
    const wordInputRef = ref(null);
    const words = ref([]);
    const submitting = ref(false);
    const errorMsg = ref("");
    const placeholderHint = "重复输入同一个单词会累加背诵次数";
    const sortMode = ref(localStorage.getItem("vocab_sort_mode") || "count");

    const totalReviews = computed(() =>
      words.value.reduce((sum, w) => sum + w.review_count, 0)
    );

    function setSortMode(mode) {
      sortMode.value = mode;
      localStorage.setItem("vocab_sort_mode", mode);
      sortWords();
    }

    function sortWords() {
      words.value.sort((a, b) => {
        if (sortMode.value === "time") {
          return new Date(b.last_reviewed_at) - new Date(a.last_reviewed_at);
        }
        if (sortMode.value === "alpha") {
          return a.word_key.localeCompare(b.word_key);
        }
        if (b.review_count !== a.review_count) return b.review_count - a.review_count;
        return new Date(b.last_reviewed_at) - new Date(a.last_reviewed_at);
      });
    }

    async function checkAuth() {
      try {
        const res = await fetch("/api/me");
        if (res.ok) {
          currentUser.value = await res.json();
          await loadWords();
        } else {
          currentUser.value = null;
        }
      } catch (e) {
        currentUser.value = null;
      } finally {
        checkingAuth.value = false;
      }
    }

    async function login() {
      if (loggingIn.value) return;
      if (!loginForm.username || !loginForm.password) {
        loginError.value = "请输入用户名和密码";
        return;
      }
      loggingIn.value = true;
      loginError.value = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: loginForm.username, password: loginForm.password }),
        });
        const data = await res.json();
        if (!res.ok) {
          loginError.value = data.error || "登录失败";
          return;
        }
        currentUser.value = data;
        loginForm.password = "";
        await loadWords();
      } catch (e) {
        loginError.value = "网络错误，请重试";
      } finally {
        loggingIn.value = false;
      }
    }

    async function logout() {
      try {
        await fetch("/api/logout", { method: "POST" });
      } catch (e) {
        // 忽略网络错误，前端照样清掉登录态
      }
      currentUser.value = null;
      words.value = [];
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    let pollTimer = null;

    // 只要列表里还有查词中的单词，就定时刷新列表，直到后台把释义写回
    function schedulePollIfNeeded() {
      const hasPending = words.value.some((w) => w.translating);
      if (!hasPending) {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        return;
      }
      if (pollTimer) return;
      pollTimer = setInterval(async () => {
        await loadWords();
      }, 1500);
    }

    async function loadWords() {
      try {
        const res = await fetch("/api/words");
        if (!res.ok) throw new Error("加载失败");
        words.value = await res.json();
        sortWords();
        schedulePollIfNeeded();
      } catch (e) {
        errorMsg.value = "列表加载失败，请刷新重试";
      }
    }

    async function submitWord() {
      const word = inputWord.value.trim();
      if (!word || submitting.value) return;
      submitting.value = true;
      errorMsg.value = "";
      try {
        const res = await fetch("/api/words", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ word }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorMsg.value = data.error || "记录失败";
          return;
        }
        const idx = words.value.findIndex((w) => w.id === data.id);
        if (idx >= 0) {
          words.value[idx] = data;
        } else {
          words.value.push(data);
        }
        sortWords();
        schedulePollIfNeeded();
        inputWord.value = "";
      } catch (e) {
        errorMsg.value = "网络错误，请重试";
      } finally {
        submitting.value = false;
        await nextTick();
        wordInputRef.value?.focus();
      }
    }

    async function deleteWord(w) {
      try {
        await ElMessageBox.confirm(`确定删除「${w.display_word}」吗？`, "提示", {
          confirmButtonText: "删除",
          cancelButtonText: "取消",
          type: "warning",
        });
      } catch (e) {
        return;
      }
      try {
        const res = await fetch(`/api/words/${w.id}`, { method: "DELETE" });
        if (!res.ok) throw new Error();
        words.value = words.value.filter((x) => x.id !== w.id);
      } catch (e) {
        errorMsg.value = "删除失败，请重试";
      }
    }

    async function archiveWord(w) {
      try {
        const res = await fetch(`/api/words/${w.id}/archive`, { method: "POST" });
        if (!res.ok) throw new Error();
        words.value = words.value.filter((x) => x.id !== w.id);
      } catch (e) {
        errorMsg.value = "归档失败，请重试";
      }
    }

    onMounted(checkAuth);

    return {
      checkingAuth,
      currentUser,
      loginForm,
      loginError,
      loggingIn,
      login,
      logout,
      inputWord,
      wordInputRef,
      words,
      submitting,
      errorMsg,
      placeholderHint,
      totalReviews,
      sortMode,
      setSortMode,
      submitWord,
      deleteWord,
      archiveWord,
      formatTime,
    };
  },
})
  .use(ElementPlus, { locale: window.ElementPlusLocaleZhCn })
  .mount("#app");
</script>
</body>
</html>
